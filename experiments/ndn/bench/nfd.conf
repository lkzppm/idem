; NFD configuration of every forwarder of the E4 bench (experiments/ndn/bench, spec/05-evaluation.md).
; Based on the image's /config/nfd.conf (ghcr.io/named-data/nfd:20261105, NFD 24.07+git.23c53535).
; Differences: a Content Store of 4096 packets (about the overlay's 8 MiB at the bench's 2 KiB median
; page); TCP faces from any address are "local" (the producer app registers its prefix over TCP on
; 127.0.0.1); no Ethernet, UDP multicast or WebSocket faces. Forwarder-to-forwarder and agent faces
; are UDP unicast, so link loss reaches NDN and is recovered by consumer retransmission.

general
{
}

log
{
  default_level WARN
}

forwarder
{
  default_hop_limit 0
}

tables
{
  cs_max_packets 4096
  cs_policy lru
  cs_unsolicited_policy drop-all

  strategy_choice
  {
    /               /localhost/nfd/strategy/best-route
    /localhost      /localhost/nfd/strategy/multicast
    /localhost/nfd  /localhost/nfd/strategy/best-route
  }

  network_region
  {
  }
}

face_system
{
  general
  {
    enable_congestion_marking no
  }

  unix
  {
    path /run/nfd/nfd.sock
  }

  tcp
  {
    listen yes
    port 6363
    enable_v4 yes
    enable_v6 no
    local
    {
      whitelist
      {
        subnet 127.0.0.0/8
      }
      blacklist
      {
      }
    }
  }

  udp
  {
    listen yes
    port 6363
    enable_v4 yes
    enable_v6 no
    idle_timeout 600
    unicast_mtu 8800
    mcast no
  }
}

authorizations
{
  authorize
  {
    certfile any
    privileges
    {
      faces
      fib
      cs
      strategy-choice
    }
  }
}

rib
{
  localhost_security
  {
    trust-anchor
    {
      type any
    }
  }

  readvertise_nlsr no
}
