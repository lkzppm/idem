; NFD configuration for the IDEM NFD check (experiments/ndn/nfd, spec/tasks/ndn.md).
; Based on the image's /config/nfd.conf (ghcr.io/named-data/nfd:20261105, NFD 24.07+git.23c53535).
; Differences: a small Content Store; TCP faces from any address are "local" (Docker Desktop NATs host
; connections, so the host's face would otherwise be non-local and /localhost/nfd/rib/register refused);
; no Ethernet and no UDP multicast faces.

general
{
}

log
{
  default_level INFO
}

forwarder
{
  default_hop_limit 0
}

tables
{
  cs_max_packets 1024
  cs_policy lru
  cs_unsolicited_policy drop-all

  strategy_choice
  {
    /               /localhost/nfd/strategy/best-route
    /localhost      /localhost/nfd/strategy/multicast
    /localhost/nfd  /localhost/nfd/strategy/best-route
  }

  network_region
  {
  }
}

face_system
{
  general
  {
    enable_congestion_marking no
  }

  unix
  {
    path /run/nfd/nfd.sock
  }

  tcp
  {
    listen yes
    port 6363
    enable_v4 yes
    enable_v6 no
    local
    {
      whitelist
      {
        subnet 0.0.0.0/0
      }
      blacklist
      {
      }
    }
  }

  udp
  {
    listen yes
    port 6363
    enable_v4 yes
    enable_v6 no
    idle_timeout 600
    unicast_mtu 8800
    mcast no
  }

  websocket
  {
    listen yes
    port 9696
    enable_v4 yes
    enable_v6 no
  }
}

authorizations
{
  authorize
  {
    certfile any
    privileges
    {
      faces
      fib
      cs
      strategy-choice
    }
  }
}

rib
{
  localhost_security
  {
    trust-anchor
    {
      type any
    }
  }

  readvertise_nlsr no
}
