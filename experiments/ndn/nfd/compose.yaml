# Three NFD forwarders for the IDEM NFD check (spec/tasks/ndn.md). Run through `pnpm exp:ndn`.
# Topology: edge1, edge2 → regional. Every name is prefixed `idem-nfd-` so nothing else on the host
# is touched; `docker compose -p idem-nfd down` removes exactly what this file creates.
name: idem-nfd

x-nfd: &nfd # ghcr.io/named-data/nfd:20261105 (NFD 24.07+git.23c53535), pinned by index digest.
  image: ghcr.io/named-data/nfd@sha256:d9ffc6fb0a6171af4fc69c4d6a18f8e4d9d9dd130f28c768716c500c283504a5
  volumes:
    - ./nfd.conf:/config/nfd.conf:ro
  networks: [idem-nfd-net]

services:
  edge1:
    <<: *nfd
    container_name: idem-nfd-edge1
    hostname: idem-nfd-edge1
    ports:
      - "127.0.0.1:16363:6363/tcp"
      - "127.0.0.1:16363:6363/udp"
      - "127.0.0.1:19696:9696/tcp"
  edge2:
    <<: *nfd
    container_name: idem-nfd-edge2
    hostname: idem-nfd-edge2
    ports:
      - "127.0.0.1:16364:6363/tcp"
  regional:
    <<: *nfd
    container_name: idem-nfd-regional
    hostname: idem-nfd-regional
    ports:
      - "127.0.0.1:16365:6363/tcp"

networks:
  idem-nfd-net:
    name: idem-nfd-net
